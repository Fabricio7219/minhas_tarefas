name: minhas_tarefas
description: "Aplicativo de lista de tarefas com login e CRUD usando Flutter e SQLite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados SQLite (Android / iOS / macOS)
  sqflite: ^2.4.1
  # Driver SQLite para rodar no Windows e no Linux (desktop)
  sqflite_common_ffi: ^2.3.4
  # Monta o caminho do arquivo do banco
  path: ^1.9.0
  # Gera o hash (SHA-256) da senha antes de salvar no banco
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
